      "body": "<p>It was great to meet with our Student Representative Council (SRC) this week. The SRC comprises each grade&#8217;s Captains, and meets together every fortnight. The purpose of the SRC is to promote a cross-section of views from a range of grades, cultures and backgrounds, and for our students to contribute their voice towards the decision making within our school. We know that young people have a right to be heard about decisions that affect them (United Nations&#8217; Convention on the Rights of the Child &#8211; CROC; NSW Child Safe Standards). Where there is active participation from students, schools develop safer schools and stronger relationships with the community (Department of Education and Early Childhood Development). During our SRC meetings, all leaders must be responsible and trusted, collaborative, respectful, caring and be open-minded to ideas.</p>\n          <p>This past month, the SRC has been consulted about our school&#8217;s behavioural expectations. We were keen to learn from our students where they feel are the &#8216;hotspots&#8217; around the school so we can set clearer behavioural expectations. Students also shared the expectations they feel we need to communicate more to everyone in our school.</p>\n          <p>Mrs Larissa Cameron</p>\n          <p><em>Deputy Principal</em></p>\n          <p>&#8216;Be respectful to our environment, and don&#8217;t litter.&#8217; <em>Ernie C, Year 4 </em>&#8217;Don&#8217;t hurt people by touching them.&#8217;</p>\n          <p><em>Cameron F, Year 2 </em>&#8217;Listen to others so you don&#8217;t hurt their feelings.&#8217;<br><em>Teddy N, Year 2 </em>&#8217;Use technology safely.&#8217;<br><em>Isabella H, Year 3 </em>&#8217;Think before you say something.&#8217; <em>Ella F, Year 3</em></p>\n          <p>Thanks to our Grade Captains for their contribution to our SRC this term.</p>",
