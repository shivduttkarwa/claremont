      "body": "<p>Claremont College has recently made changes to the way we provide feedback to parents about student achievement and progress throughout the year. These changes reflect the new NSW K-6 syllabuses for English and Mathematics. New processes for providing feedback to parents have now been implemented. This feedback will be provided in addition to formal Semester Reports, which from 2023 will provide additional detail about your child’s achievement regarding the content areas and outcomes within English and Mathematics. Throughout the year, and beyond reports, the following feedback about learning can be expected.<br><em>Kindergarten to Year 2</em></p>\n          <p>&nbsp;<em>ESTA-L feedback</em></p>\n          <p>&#8211; ESTA-L is an early literacy screening tool that has been developed by the Association of Independent Schools of NSW to assist teachers to map students’ phonological, phonemic awareness and phonics skills. These constrained skills are fundamental to ensuring all children learn to read, particularly for students in Kindergarten to Year 2. For every child, each instructional priority will be identified as: within the expected grade age, requiring monitoring, or requiring further intervention. The language of ‘not yet’, ‘kind of’ and ‘got it’ will be used for each of these priorities. One-to-one assessment using this tool takes place in Terms 1, 2 and 4 for all students in Kindergarten to Year 2. &#8211; ESTA-L feedback will be shared with parents via student diaries at the following times in the year:<br>&#8211; mid Term 1<br>&#8211; mid to late Term 2<br>&#8211; mid to late Term 4</p>\n          <p><em>Early Numeracy Report</em></p>\n          <p>&#8211; The Early Numeracy Screener has been developed by the Association of Independent Schools of NSW to assist teachers to map students’ numeracy skills. Numeracy is the knowledge, skills, behaviours and dispositions that students need in order to use mathematics in a wide range of situations. Essential skills involve counting forward and backwards, identifying numbers before and after, numeral recognition, place value, addition, subtraction, and problem-solving. For every child, each instructional priority will be identified as: within the expected grade age, requiring monitoring, or requiring further intervention. The language of ‘not yet’, ‘kind of’ and ‘got it’ will be used for each of these priorities. One-to-one assessment using this tool takes place in Terms 1, 2 and 4 for all students in Kindergarten to Year 2. &#8211; Early Numeracy feedback will be shared with parents via student diaries at the following times in the year:<br>&#8211; mid Term 1<br>&#8211; mid to late Term 2<br>&#8211; mid to late Term 4</p>",
