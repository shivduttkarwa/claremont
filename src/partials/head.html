<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="theme-color" content="#0d4749">
<meta name="format-detection" content="telephone=no">
<link rel="preload" href="assets/fonts/argent-cf-thin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/instrument-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/main.css">
<script>
  (function (d) {
    d.classList.add("anim-ready");
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("anim-reduced");
    // if the bundle never runs, drop the guard rather than leave the page hidden
    addEventListener("load", function () {
      setTimeout(function () { if (!d.hasAttribute("data-anim-live")) d.classList.remove("anim-ready"); }, 800);
    });
  })(document.documentElement);
</script>
<noscript><style>[data-anim]{visibility:visible !important}</style></noscript>
