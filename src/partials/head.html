<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="theme-color" content="#0d4749">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="assets/css/main.css">
<script>
  (function (d) {
    d.classList.add("anim-ready");
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("anim-reduced");
    // after a page transition the hero entrance waits for the slide to land; a back step reverses the slide
    window.__pageArrival = new Promise(function (resolve) {
      addEventListener("pagereveal", function (e) {
        var vt = e.viewTransition, nav = window.navigation && navigation.activation;
        if (vt && vt.types && nav && nav.from && nav.entry && nav.from.index > nav.entry.index) vt.types.add("back");
        resolve(vt ? vt.finished : null);
      }, { once: true });
      requestAnimationFrame(function () { resolve(null); });
    });
    // if the bundle never runs, drop the guard rather than leave the page hidden
    addEventListener("load", function () {
      setTimeout(function () { if (!d.hasAttribute("data-anim-live")) d.classList.remove("anim-ready"); }, 800);
    });
  })(document.documentElement);
</script>
<noscript><style>[data-anim]{visibility:visible !important}</style></noscript>
