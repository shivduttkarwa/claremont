<!-- @wagtail-partial: search — site settings. Desktop: Figma 2125:14070 "claremont search" + 2125:14365 "filled and clicked"
     (Design 2 canvas): a 90% Dark Green wash over the page, the header showing through, a 768 bar under the nav.
     Phone: 2125:14449 "claremont homepage M": a solid panel with the bar centred, a back arrow and the search glyph lit.
     The form GETs `q` to the Wagtail search view once it exists (set `action`); until then scripts/search.js
     intercepts submit and lists matches from the build-time index as a stand-in. Figma draws no results state. -->
<div class="search" id="site-search" role="dialog" aria-modal="true" aria-label="Search Claremont College" data-search data-lenis-prevent hidden>
  <div class="search__panel">
    <div class="search__top">
      <a class="site-header__logo" href="index.html">
        <img src="assets/images/logo/logo-321.webp" srcset="assets/images/logo/logo-213.webp 213w, assets/images/logo/logo-238.webp 238w, assets/images/logo/logo-272.webp 272w, assets/images/logo/logo-321.webp 321w, assets/images/logo/logo-322.webp 322w, assets/images/logo/logo-361.webp 361w, assets/images/logo/logo-374.webp 374w, assets/images/logo/logo-422.webp 422w, assets/images/logo/logo-482.webp 482w, assets/images/logo/logo-561.webp 561w, assets/images/logo/logo-642.webp 642w, assets/images/logo/logo-722.webp 722w, assets/images/logo/logo-844.webp 844w, assets/images/logo/logo-963.webp 963w, assets/images/logo/logo-1089.webp 1089w" sizes="(min-width: 2560px) 482px, (min-width: 2200px) 422px, (min-width: 1920px) 361px, (min-width: 1400px) 321px, (min-width: 1200px) 238px, (min-width: 992px) calc(38.4615vw - 189.5px), 213px" alt="Claremont College" width="1089" height="270">
      </a>
      <button class="search__close" type="button" data-search-close aria-label="Close search">
        <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
      </button>
    </div>

    <div class="search__body">
      <form class="search__form" id="search-form" role="search" method="get" data-search-form>
        <label class="visually-hidden" for="search-input">Search</label>
        <input class="search__input" id="search-input" name="q" type="search" placeholder="Search" data-search-input
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button class="arrow-btn arrow-btn--next search__submit" type="submit" aria-label="Search">
          <svg class="icon" aria-hidden="true"><use href="#icon-arrow-right"></use></svg>
        </button>
      </form>

      <div class="search__tools">
        <button class="search__tool search__tool--back" type="button" data-search-back aria-label="Back to menu">
          <svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"></use></svg>
        </button>
        <button class="search__tool search__tool--go" type="submit" form="search-form" aria-label="Search">
          <svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
        </button>
      </div>

      <div class="search__results" data-search-results hidden>
        <p class="search__meta" data-search-meta></p>
        <ol class="search__list" data-search-list></ol>
      </div>
    </div>

    <p class="visually-hidden" role="status" aria-live="polite" data-search-status></p>
  </div>
</div>
