<!-- @wagtail-block: cta_links (roomy, with button)
     title: CharBlock(required)
     links: ListBlock(StructBlock(label:CharBlock, document:DocumentChooserBlock / page:PageChooserBlock))
     cta:   StructBlock(text:CharBlock, url:URLBlock) -->
<section class="cta-links cta-links--roomy cta-links--with-actions" aria-labelledby="fees-title">
  <div class="container">
    <div class="row g-4 row-split">
      <div class="col-lg-6">
        <h2 id="fees-title" data-anim="split" data-anim-type="chars-soft">Fees and dates</h2>
      </div>
      <div class="col-lg-6">
        <div class="cta-links__aside" data-anim="sequence" data-anim-type="nudge-right" data-anim-stagger=".25">
        <ul class="cta-links__list">
          <li class="cta-links__item" data-anim-item><a class="cta-links__link" href="#">2027 Fee Schedule<svg class="icon" aria-hidden="true"><use href="#icon-arrow-diagonal"></use></svg></a></li>
          <li class="cta-links__item" data-anim-item><a class="cta-links__link" href="#">Term Dates<svg class="icon" aria-hidden="true"><use href="#icon-arrow-diagonal"></use></svg></a></li>
        </ul>
        <div class="cta-links__actions" data-anim-item="fade-up">
          <a class="btn btn-primary btn-primary--ink" href="#apply">Apply to enrol</a>
        </div>
        </div>
      </div>
    </div>
  </div>
</section>
