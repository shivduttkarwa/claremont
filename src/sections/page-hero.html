<!-- @wagtail-block: page_hero
     title: RichTextBlock (may carry a line break)
     image: ImageChooserBlock
     aside: ListBlock(StructBlock(label:CharBlock, value:CharBlock, url:URLBlock, icon:ChoiceBlock)) — optional contact lines
     quick links come from the subnav site setting (partials/subnav.html)
     Below lg (the 375 frames' "Mobile header", 2087:12629) the photo sits under the bar, a square on phones and 3 : 2
     from sm, and the title follows on Dark Green; the quick links sit on the block's bottom edge and scroll with the page.
     locals: title, image, image_2x (the same photo at 3280, for dense and wide screens), width, height,
     image_m (the square phone crop, 750 × 750), image_m_3x (the same at 1125), aside (HTML list items, or empty), modifier -->
<section class="page-hero {{ modifier }}" aria-labelledby="page-title" data-anim-parallax-trigger>
  <div class="page-hero__media" aria-hidden="true">
    <picture>
      <source media="(min-width: 576px)" srcset="{{ image }} {{ width }}w, {{ image_2x }} 3280w" sizes="100vw" width="{{ width }}" height="{{ height }}">
      <img class="page-hero__img" fetchpriority="high" decoding="async" src="{{ image_m }}" srcset="{{ image_m }} 750w, {{ image_m_3x }} 1125w" sizes="100vw" alt="" width="750" height="750"
           data-anim="parallax" data-anim-axis="y" data-anim-speed="12" data-anim-reverse data-anim-start="top top" data-anim-disable-mobile>
    </picture>
  </div>

  <div class="container">
    <div class="page-hero__row">
      <h1 id="page-title" data-anim="split" data-anim-type="chars" data-anim-tier="hero" data-anim-order="1" data-anim-lead="0.85">{{{ title }}}</h1>
      <ul class="page-hero__aside" data-tap-aa data-anim="reveal" data-anim-tier="hero" data-anim-order="2">{{{ aside }}}</ul>
    </div>
  </div>

  <div class="page-hero__subnav" data-anim="sequence" data-anim-type="enter-right" data-anim-type-mobile="rise-soft" data-anim-tier="hero" data-anim-order="2" data-anim-stagger="0.08" data-anim-stagger-mobile="0.08" data-anim-lead-mobile="0.7">
    <include src="partials/subnav.html"></include>
  </div>
</section>
