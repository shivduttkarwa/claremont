<!-- @wagtail-page: NewsArticlePage
     standfirst: CharBlock (optional: without one the left column is only Back to news)
     image:      ImageChooserBlock
     body:       RichTextBlock
     previous / next: sibling pages (either may be missing: the newest has no previous, the oldest no next)
     locals: standfirst, image, alt, width, height, body, prev_url, prev_title, next_url, next_title -->
<article class="article">
  <div class="container">
    <div class="row g-4 row-split">
      <div class="col-lg-5">
        <if condition="standfirst">
        <h2 data-anim="split" data-anim-type="chars-soft" data-anim-type-mobile="lines">{{ standfirst }}</h2>
        </if>
        <a class="btn btn-primary article__back" href="news.html" data-anim="reveal" data-anim-order="1">Back to news</a>
      </div>
      <div class="col-lg-7">
        <div class="article__main">
        <figure class="article__media" data-anim="reveal" data-anim-type="fade" data-anim-order="2">
          <img src="{{ image }}" alt="{{ alt }}" width="{{ width }}" height="{{ height }}">
        </figure>
        <div class="article__body rich-text" data-anim-group="fade-up">
          {{{ body }}}
        </div>

        <nav class="article__nav" aria-label="More articles">
          <if condition="prev_url">
          <a class="article__nav-link" href="{{ prev_url }}">
            <span class="arrow-btn arrow-btn--prev" aria-hidden="true"><svg class="icon"><use href="#icon-arrow-right"></use></svg></span>
            <span class="article__nav-label"><span>Previous</span><span>{{ prev_title }}</span></span>
          </a>
          </if>
          <if condition="next_url">
          <a class="article__nav-link article__nav-link--next" href="{{ next_url }}">
            <span class="article__nav-label"><span>Next</span><span>{{ next_title }}</span></span>
            <span class="arrow-btn arrow-btn--next" aria-hidden="true"><svg class="icon"><use href="#icon-arrow-right"></use></svg></span>
          </a>
          </if>
        </nav>
        </div>
      </div>
    </div>
  </div>
</article>
