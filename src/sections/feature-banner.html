<!-- @wagtail-block: feature_banner
     title: RichTextBlock (italic run)
     text:  TextBlock
     image: ImageChooserBlock
     cta:   StructBlock(text:CharBlock, url:URLBlock / document:DocumentChooserBlock) — optional
     align: ChoiceBlock(left | right) — the side the copy sits on over the photo from lg
     shade: BooleanBlock — a soft dark gradient over the photo on the copy's side, under the copy
     locals: id, title, text, align, shade, image, image_m (phone crop; pass the same file when there is none),
            width, height, modifier, actions (HTML buttons, or empty) -->
<section class="feature-banner feature-banner--{{ align }}{{ shade ? ' feature-banner--shade' : '' }} {{ modifier }}" aria-labelledby="{{ id }}" data-anim-parallax-trigger>
  <div class="feature-banner__media" aria-hidden="true">
    <div class="feature-banner__layer" data-anim="parallax" data-anim-centered data-anim-speed="18.75" data-anim-scrub-mobile="0.3">
      <picture>
        <source media="(min-width: 576px)" srcset="{{ image }}" width="{{ width }}" height="{{ height }}">
        <img src="{{ image_m }}" alt="" width="{{ width }}" height="{{ height }}" loading="lazy" decoding="async"
             data-anim="reveal" data-anim-type="scale">
      </picture>
    </div>
  </div>
  <div class="container">
    <div class="feature-banner__content" data-anim-group="fade-up">
      <h2 id="{{ id }}" data-anim="split" data-anim-type="chars-soft" data-anim-type-mobile="lines" data-anim-order="0">{{{ title }}}</h2>
      <p class="feature-banner__text">{{ text }}</p>
      <div class="feature-banner__actions">{{{ actions }}}</div>
    </div>
  </div>
</section>
