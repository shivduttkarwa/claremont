      "body": "<p>I am incredibly grateful to have had the opportunity to have attend the 2024 ASCD Annual Conference in Washington DC, along with 5000+ delegates (it is HUGE!) and to give a one hour presentation about my school entitled ‘<em>Creating a Happy, Safe, and Connected School – An Australian Case Study</em>’.</p>\n          <p>I&#8217;m also honoured to have been able to put the spotlight on Australian Education &#8211; we do so many brilliant things in Australia, and we should never underestimate what we can be sharing with others on the global stage.</p>\n          <p>My presentation at the ASCD Conference in Washington DC went very well. I was so proud to speak about Claremont and incredibly encouraged by the feedback I received. So many people told me that Claremont is one of the most inspiring schools they know of. My presentation explored the key features of learning space design, along with research-informed considerations to enhance respectful relationships, belonging, safety and connectedness in an inclusive primary (elementary) school setting. Based on comments made by many who attended Claremont is leading the way, inspiring educators from around the world with our collaborative teaching model and inclusive academic and wellbeing programs.</p>\n          <p>As a conference delegate, I learned a great deal about new and emerging issues in education. Some of the big themes that emerged included artificial intelligence in education, supporting students who have been impacted by trauma (trauma-informed practice), the wellbeing and safety of teachers and school leaders and support staff, gun violence in schools, responding to student behaviour issues, as well as many powerful talks that provided motivation around the importance of education.</p>\n          <p>The Association for Supervision and Curriculum Development (ASCD) is America’s largest education professional association. It has more than 125,000 members from more than 128 countries, including principals, teachers, school administrators and other educators.</p>\n          <p>If you are ever considering which educational conference to attend &#8230;this is it!</p>\n          <p><strong>Mr Doug Thomas,&nbsp;</strong><strong>Principal</strong></p>",
