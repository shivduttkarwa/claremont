      "body": "<p>Our ‘Grandparents and Special Friends Day’ was such a heart-warming occasion. The sun was shining, the rain held off and the children’s performances and prayers were magnificent. The classrooms looked brilliant showcasing the artistic endeavours and academic work of our students. I especially thank and honour the hard work of the whole Infants Team, led by Mrs James, in making this event possible. We also want to extend our gratitude to the many parent helpers who assisted with the morning tea.</p>\n          <p>It was wonderful to welcome new grandparents and special friends into our community as well as catching up with so many return visitors this year. Thank you to the many people who travelled from overseas, interstate and across Sydney to be with us &#8211; it means so much to the children. We also feel honoured that through events like today we recognise and celebrate the importance of connection and community in our lives.</p>\n          <p>This morning I encouraged our visitors to consider the following reflections.</p>\n          <p>Time with a grandparent or special friend is a precious gift for a child. Grandparents and special friends have a significant part to play in a child’s life irrespective of the quantity of time &#8211; so whether they are able to spend a lot of time together or just a day or two a year it can be impactful in that child’s development. From my perspective, it can be valuable in three ways:</p>\n          <p>&#8211; Spending time with children means <em>sharing moments of joy and wonder together</em>. Find and create opportunities to discover and enjoy nature, walks along the beach and playing at the park or in the garden. &#8211; <em>Sharing stories about your life and past</em>. It is through the telling of your family stories that children learn so much about who they are, their identity and understanding of the world. &#8211; <em>Offer your unconditional love</em>. In this rapidly changing world, educators and parents so often find themselves in ‘unchartered territory’. Grandparents have an important role in showing love and instilling a sense of value and worth in the lives of children. As children grow up and make mistakes they need the consistent love and safety of someone who is there for them, who they can turn to &#8211; no matter what they do and regardless of who they grow up to become.</p>\n          <p>I love our school community &#8211; thank you everyone for all you bring and contribute to the sense of love, warmth and happiness that we experience here at school. We must never forget to pray for our school &#8211; for the children, staff and families, and may we never take for granted all that we have at Claremont College.</p>\n          <p><strong>Mr Doug Thomas<br><br>Principal</strong></p>",
