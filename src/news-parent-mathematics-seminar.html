      "width": "500",
      "height": "256",
      "body": "<p>We are thrilled to share the highlights of the Parents Mathematics Seminar that took place this morning. The event was presented by Henrietta Miller from the Association of Independent Schools NSW (AISNSW). We had an incredible turnout of over 80 parents. Henrietta has been working with our staff this year and will continue to do so for the remainder of this year.</p>\n          <p>Henrietta is an expert in mathematics education and today introduced parents to the new Mathematics syllabus, equipping them with valuable resources to support their children&#8217;s mathematical development. The event began with an engaging presentation by Henrietta, covering various aspects of the new syllabus, including key concepts and how students build on their knowledge each year. Her clear explanations and practical examples enabled parents to gain a comprehensive understanding of what their child/ren are currently learning in mathematics. Furthermore, Henrietta provided parents with a range of useful resources, including websites and interactive apps that promote mathematical thinking and problem-solving skills.</p>\n          <p>Following the presentation, parents had the opportunity to visit their child’s learning spaces and participate in some mathematics activities. This hands-on experience enabled parents to witness firsthand the teaching methods and approaches employed by our dedicated teachers. It also served as a fantastic bonding opportunity, where parents actively engaged with their child’s learning environment.</p>\n          <p>The atmosphere throughout the morning was filled with enthusiasm and excitement as parents eagerly immersed themselves in the mathematics activities. It was wonderful to witness parents working alongside their children, collaborating and problem-solving together. The seminar provided a unique platform for parents to actively engage with their child’s mathematical education, nurturing a sense of shared responsibility and investment in their progress.</p>\n          <p>At Claremont College, we firmly believe that the partnership between parents and educators plays a vital role in the holistic development of our students. Events like this seminar reinforce this collaboration, empowering parents with the tools and knowledge to actively support their children&#8217;s mathematical growth</p>\n          <p>If you were unable to attend this event,&nbsp;<a href=\"https://www.claremont.nsw.edu.au/news/parent-mathematics-seminar\" target=\"_blank\" rel=\"noreferrer noopener\">we have uploaded the video and handout here.</a></p>",
