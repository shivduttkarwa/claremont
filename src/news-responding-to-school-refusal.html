      "body": "<p><strong>School Refusal</strong></p>\n          <p>Schools can be experienced as places of wonder for students, of safety so they can face challenges, of joy when they master new skills, and of laughter with shared connections. A school is a place where children discover and learn about the world, themselves and others, developing foundational skills and behaviours. However, going to school can be a challenge for some children, leading them to express a reluctance to go to school at different times.</p>\n          <p>The issue of school refusal has received attention in the popular media with the Senate Inquiry last year looking into the national trend of school refusal and related matters. The committee released its findings in August 2023, with recommendations for a coordinated national approach with improved methods of data collection, a targeted research agenda and interventions delivered within a multi-tiered system of support.</p>\n          <p>A collaboration between the NSW Department of Education, Sydney Catholic Schools, the Association of Independent Schools NSW, and the South Eastern Sydney Local Health District (SESLHD) has produced a helpful resource for schools around school refusal and emphasises the importance of early identification and early intervention. Such an approach is critical because patterns of behaviour can not only become entrenched but the challenges associated with school refusal can also snowball. Most children are occasionally reluctant to go to school or have some anxiety about activities like class tests or talking in front of the class. While it is normal for children to miss a few days of school, ongoing absences mean children can fall behind on their schoolwork, impacting their learning and confidence in the classroom. Then there is the social impact with the absences possibly leading children to become disengaged from peers and teachers, affecting their sense of belonging at school. Combined, this leads to increased anxiety about coming to school.</p>\n          <p>It is helpful to understand that there is no single ‘cause’ for school refusal, that it can be a complex interplay between school and family life, and that the reason will vary from student to student. School issues such as bullying or academic difficulties can contribute whilst family stressors such as the death of a loved one, physical or mental health concerns, and parental separation can also see a child experience school refusal. School refusal can happen at any time, but transition points such as the beginning of the year, and the new term can be particularly stressful and be triggers for school refusal.</p>\n          <p>If your child has missed school twice over two weeks combined with some of the following behaviours, this may be a pattern of school refusal:</p>\n          <p>· Tearfulness before school or repeated pleas to stay at home<br><br>· Tantrums, clinginess, dawdling or running away before school or&nbsp;during drop-off<br><br>· Frequent complaints of illness before or during school like stomach&nbsp;aches, headaches, dizziness or tiredness<br><br>· Difficulty going to school after weekends, holidays, school camps&nbsp;or sports days<br><br>· Long periods spent in sick bay or otherwise out of class<br><br>· Keeping family and child activities going<br><br>In terms of how what parents can do to support their child’s attendance:<br><br>· Listening to your child’s concerns and fears about going to school&nbsp;as issues can be addressed if understood<br><br>· If your child is ‘feeling sick’ check it out with your GP<br><br>· If you’re worried about your child’s wellbeing and mental health&nbsp;reach out to your GP or the school counsellor<br><br>· Being both firm and kind in getting your child to school regularly&nbsp;and on time will help, and not prolonging the goodbyes<br><br>· Praising your child’s positive behaviours to reinforce success<br><br>Tiffany Westphal, a board member and volunteer at ‘School Can&#8217;t Australia’,<br>a peer support network for school refusal, also suggests the importance of:<br><br>· Creating &#8216;safe&#8217; people and spaces for students experiencing school&nbsp;refusal<br><br>· Helping teachers better understand signs of distress in students<br><br>· Helping students communicate their distress to their teacher<br><br>· Understanding masking where students may appear fine, but are&nbsp;highly distressed<br><br>· Managing expectations from students who are experiencing school&nbsp;refusal</p>\n          <p>As well as taking notice and taking action early, the School Refusal resources also emphasise responding with compassion and being flexible regarding expectations for the child, ensuring collaboration between the parents and school and most importantly, engaging the student to understand their perspective on what is happening or challenging about coming to school. If you have questions or concerns about your child and school refusal, please do not hesitate to reach out to us here at the school.<strong><br><br>Miss Catherine McKersie, School Counsellor</strong></p>",
