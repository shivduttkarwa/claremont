      "body": "<p>Today is ‘National Day of Action’. Claremont College takes bullying seriously and we actively seek opportunities to teach our students about the different forms of bullying, and how they can respond if they see or experience bullying. Bullying may be physical, social, cyber or verbal. It may involve racism, sexism or classism. We know how serious the impact can be on people’s lives. Claremont College does not tolerate bullying.</p>\n          <p>Interpersonal relationships are complex. As children grow and change, shifts in friendship groups are common, with conflict being a normal part of any relationship. However, targeted and ongoing bullying behaviours are not. Next week your child&#8217;s grade will discuss how conflict within healthy relationships differs from unhealthy bullying behaviours. It is important we focus on the ways we can all help create a safe, positive and compassionate community for everyone.</p>\n          <p>Bullying… what is it exactly? Many people think that their child may be bullied when in fact their child has just had a one-off disagreement. So here is what we teach our students:</p>\n          <p><em>&#8221;Bullying is more than just a fight, being mean or disliking someone. Bullying is when someone or a group of people who have more power than you, repeatedly use words of actions to hurt you. It can happen anywhere – at home, with friends, in a group, on the bus or at school.&#8221;</em></p>\n          <p>The national definition of bullying in Australian schools is:</p>\n          <p><em>&#8221;Bullying is an ongoing misuse of power in relationships through repeated verbal, physical and/or social behaviour that causes physical and/or psychological harm. It can involve an individual or a group misusing their power over one or more persons. Bullying can happen in person or online, and it can be obvious (overt) or hidden (covert). Bullying of any form or for any reason can have long-term effects on those involved, including bystanders. Single incidents and conflict or fights between equals, whether in person or online, are not defined as bullying. However, these conflicts still need to be addressed and resolved.&#8221;</em> <em>(Bullying No Way!)</em></p>\n          <p>We explain that bullying can come in different forms, including physical, social, cyber and verbal bullying. Your child is (or children are) learning ways they can respond if they see or if they experience bullying. The following are some of the strategies that have been discussed with your child:</p>\n          <p>If you think bullying happens in person to you, try these strategies:<br><br>&#8211; Ignore them (try not to show any reaction);<br>&#8211; Tell them to stop and then walk away;<br>&#8211; Pretend you don’t care;<br>&#8211; Go somewhere safe;<br>&#8211; Get support from your friends; and<br>&#8211; Speak to a trusted adult.</p>\n          <p>Remember, different things work for different types of bullying.</p>\n          <p>If bullying happens online, try these strategies:<br><br>&#8211; Avoid responding to the bullying;<br>&#8211; Block and report anyone who is bullying online;<br>&#8211; Protect yourself online – use privacy settings and keep records; and<br>&#8211; Tell a trusted adult.<br><br>If you see someone being bullied:<br><br>&#8211; Don’t leave negative online conversations – don’t join in;<br>&#8211; Support others being bullied; and<br>&#8211; Tell a trusted adult.<br><br>If the bullying doesn’t stop:<br><br>&#8211; Talk to an adult (parent, teacher) who can help stop the bullying; and<br>&#8211; Keep asking for support until the bullying stops.<br><br>‘Bullying No Way’ advises parents that if your child talks to you about bullying:</p>\n          <p>&#8211; Listen calmly and get the full story;<br>&#8211; Reassure and ask your child what they want to do about it and how you&nbsp;can help;<br>&#8211; Contact your child’s Class Teacher;<br>&#8211; Visit&nbsp;<a href=\"https://bullyingnoway.gov.au/support-and-advice/for-families\">https://bullyingnoway.gov.au/s&#8230;</a>&nbsp;to find&nbsp;some strategies; and<br>&#8211; Check in regularly with your child</p>\n          <p><em>Further reading:</em></p>\n          <p>&#8211; Kids Helpline&nbsp;<a href=\"http://www.kidshelpline.com.au/\">http://www.kidshelpline.com.au&#8230;</a>&nbsp;1800&nbsp;551 800<br>&#8211; Headspace&nbsp;<a href=\"http://www.headspace.org.au/\">www.headspace.org.au</a>&nbsp;<a href=\"http://www.headspace.org.au/\">http://www.headspace.org.au/</a>&nbsp;1800 650&nbsp;890<br>&#8211; Online bullying&nbsp;<a href=\"http://www.esafety.gov.au/\">www.esafety.gov.au</a><br>&#8211; <em>Take a Stand Together</em> is a free app that has tips and advice about&nbsp;bullying for young people.<br>&#8211; <em>The Allen Adventure</em> is an interactive story for children to help&nbsp;develop social skills.</p>\n          <p><strong>Larissa Cameron, Deputy Principal</strong></p>",
