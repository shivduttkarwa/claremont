      "body": "<p>I’m writing this piece in consideration of one of the many tricky decisions parents have to have to make: <em>Should I send my child to school today or not? </em></p>\n          <p>I&#8217;m envisioning a scenario that my wife and I often faced with our three kids. They wake up in the morning, complain about a tummy ache or something similar and then say they do not want to go to school. OR, it’s the opposite, the child is coughing and spluttering whilst simultaneously declaring that they are feeling fine and do not want to miss school. Despite their protests, the cold and flu symptoms are clearly visible, and most likely they are infectious and you know you’ll inevitably be getting a phone call from the school nurse to please come and collect your child.</p>\n          <p>Oh the joy of parenting! And why do these scenarios often correspond with a hectic time for yourself at work, which includes giving a major presentation and you cannot afford to take time off yourself. <em>This week has been challenging</em></p>\n          <p>It is well and truly the winter cold and flu season, and we have experienced a significantly high number of absences, from both students and staff. Even our regular pool of relief teaching staff has been impacted this week, with replacements not possible at times. In situations like this, we certainly see one of the many benefits of collaborative teaching &#8211; the ability of the grade team to ensure continuity of learning and care of the children, despite staff members being away. Unlike many other schools, we rarely have the scenario where a relief teacher is placed in a class by themself without the support and guidance that comes from teachers working collaboratively together. <em>When your child is sick </em></p>\n          <p>Please support the staff and other children by NOT sending your child to school if you know that he or she is potentially unwell or sick. If your child displays any of the typical flu symptoms (including coughing, sneezing, high temperatures, aches and pains or gastro) please see your doctor and keep him/her at home so that he/she has the best chance of fully recovering. It is particularly unfair that staff and other children have to endure and share the germs of those who knowingly attend school having been sick either during the previous night or prior to coming to school in the morning. A reminder too, that wearing face masks at school is always strongly encouraged. <em>Every Day Counts</em></p>\n          <p>This year there has been quite a lot of press coverage describing the post-pandemic issue of record numbers of children not attending school. According to the Sydney Morning Herald:</p>\n          <p><em>More than 60 per cent of NSW public high school students missed at least four weeks of class in 2022, the worst attendance level on record. Only 48.7 percent of all primary public school children went to school more than 90 per cent of the time last year. While sick days due to </em><a href=\"https://www.smh.com.au/link/follow-20170101-p5a8yg\">COVID and flu cases</a><em>&nbsp;were behind the falling attendance levels, some in the education sector say the latest figures are part of a bigger trend of student disengagement and schools are now offering late starting times for students who spend much of the night gaming as a short-term measure to re-engage them. </em></p>\n          <p>This suggests there is much to be concerned about, and as I mentioned earlier, I empathise with parents who are finding it difficult in deciding whether to send their child to school, or not. It is trying to find a balance of sorts and knowing what your child needs in that specific context. Is it the nurturing voice that suggests despite their enthusiasm, it is a day of rest that they need for their own health and wellbeing. Or is it the curiosity, compassion and patience to understand what is going on and appreciating that avoidance is only pushing a problem down the road for another day. I remember when my kids were at school, we struggled with concerns that we were reinforcing a negative pattern of behaviour by allowing the child to stay home. Should you find yourself in this situation I encourage you to reach out to us &#8211; either to your child’s teacher or our School Counsellor. We certainly need to know if your child is anxious about coming to school, resistant or refusing to leave the house in the morning. There can be many valid reasons why a child may not want to come to school, including social anxiety, problems with friends, bullying, worry about school work, fatigue, illness, lack of sleep or poor sleeping patterns. All of these things need to be explored together with the child, parents and the school. <em>Claremont’s 2022 Attendance Data </em></p>\n          <p>Given the above I found it pleasing and most encouraging to look at our attendance data for 2022. Our students attend school way above the NSW average school attendance figures.</p>\n          <p><em>94.34% of Claremont students (K-6) attended school on average each school day in 2022.</em> <em>Some further points about school attendance</em></p>\n          <p>You may find this information from the NSW Department of Education website (<a href=\"https://education.nsw.gov.au/parents-and-carers/initiatives/every-day-matters\" target=\"_blank\" rel=\"noreferrer noopener\">link here</a>)&nbsp;interesting.</p>\n          <p>Consistent attendance improves student outcomes, increases career options, and helps students build relationships and confidence. Missing a day here or there may not seem like much but absences add up and can impact your child’s learning more than you think. When your child misses one day a week over a year, that’s 40 days of school, 8 weeks of lessons and 2.5 years over their school life lost. <em>Aiming for 95% attendance</em></p>\n          <p>Students are expected to have above a 95% school<a href=\"https://education.nsw.gov.au/student-wellbeing/attendance-matters-resources-for-schools/compulsory-school-attendance\" target=\"_blank\" rel=\"noreferrer noopener\">&nbsp;attendance rate</a>, because days missed are years lost. That’s why making sure your child comes to school every single day (unless genuinely sick) is so important. <em>Holiday Time</em></p>\n          <p>Please remember, holidays should only be booked during school breaks. Students should be at school every day during school term, right from the first day until the last. If there are special circumstances that require your child to take extended leave during term time, parents must apply, so that a ‘Certificate for Exemption from Attendance at School’ to be considered and approved by the Principal. Further details are provided below. <em>Safe Learning Environment</em></p>\n          <p>We know that the last couple of years have been tough, and we will continue to prioritise student’s health and wellbeing by listening to health advice, providing support and maintaining a safe learning environment.</p>\n          <p>Research has shown that one of the most powerful correlations with good attendance is when children have a sense of ‘connectedness’ with their school. This connection manifests in different ways &#8211; connection with their teachers, friends and learning. This connection also comes from being seen, from being known and feeling understood, from being loved and valued for their own individuality, from being respected by others and importantly from feeling safe.</p>\n          <p>I am convinced that this is one of the reasons why Claremont students want to come to school, and more often than not, leave school every day with a smile on their face. <em>Applying for Extended Leave</em></p>\n          <p>Term time and term breaks are advertised well in advance and parents are requested to make plans accordingly. However in the event of exceptional circumstances parents may apply for their child to take an extended leave of absence. An Application for Extended Leave is required for a period of 4 or more school days. This application form is available via the school website under Forms.</p>\n          <p>It is recommended that the application is submitted via the school office at least 10 days prior to the first day of leave. Once submitted the application is reviewed by Mr Thomas and a Certificate for Exemption from Attendance at School is issued once it has been approved. The relevant teaching teams will be notified of the child’s absence and the absence will be pre recorded on Edumate thereby avoiding the family receiving an SMS each morning during this period of requested absence.</p>\n          <p>Claremont College strongly discourages all absences during term time, particularly for a great length of time where significant curriculum will be missed.</p>\n          <p>Please note that in instances where children are absent for extended holiday leave, it is not possible for teachers to provide class work or additional homework for their students. There are often lessons, skills and concepts that simply will be missed and essential outcomes within the curriculum will not be able to be assessed.</p>",
