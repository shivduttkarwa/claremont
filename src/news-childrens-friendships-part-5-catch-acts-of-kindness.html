      "body": "<p>Kindness is a powerful force that can uplift spirits, foster connection, and create a sense of belonging. When we choose to approach our interactions with kindness, we cultivate a more compassionate and supportive environment. We can ‘<em>be the reason someone believes in the goodness of others</em>’.</p>\n          <p>We often show our friends kindness but struggle to do this with others we might not know so well or to strangers. But promoting kindness in our interactions with others can be as simple as offering a smile, a genuine compliment, or a helping hand. Taking the time to truly listen to others can also go a long way in fostering kindness. By being present and attentive, we demonstrate that we value and care for the person. Small acts of kindness, no matter how seemingly insignificant, have the power to create a more harmonious and compassionate society.</p>\n          <p>Being able to ‘catch’ acts of kindness around us can inspire awe at the ‘moral beauty’ that humans are capable of demonstrating to each other. The Greater Good Science Centre at Berkeley has developed a simple strategy of writing down kind acts witnessed in the day as a way of promoting connections, of being more hopeful and inspiring pro-social behaviours. So whether we demonstrate, receive or witness acts of kindness it promotes an environment that is more connected and compassionate.</p>\n          <p><strong>Ms Catherine McKersie, School Counsellor</strong></p>",
