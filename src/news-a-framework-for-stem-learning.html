      "body": "<p>At Claremont College, each grade engages with timetabled STEM activities every week. Underpinning these activities is the following framework.</p>\n          <figure><img src=\"assets/images/news/articles/a-framework-for-stem-learning-framework.webp\" alt=\"The STEM framework in five steps. Empathise: students are presented with real world problems and gather information about how these problems affect people. Define: students investigate these problems further by researching and analysing. Ideate: students brainstorm as many solutions to problems as they can. Prototype: students choose the best solution and find quick and simple ways to test those solutions; our learners may construct their designs during this phase. Test: students test their solutions, gather insights and evaluate results; if necessary, students may need to go back to previous phases of the framework.\" width=\"1036\" height=\"738\" loading=\"lazy\" decoding=\"async\"></figure>\n          <p>At Claremont College, STEM learning is characterised by investigative challenges and technology experiences.</p>\n          <p>During STEM investigations, students are presented with problems or challenges. They collaborate in small groups to use construction materials to design and create solutions that meet set criteria. These challenges can also be interdisciplinary.</p>\n          <p><em>“It really gets me into a creative mood. There are so many possibilities and variations. It really helps me develop my teamwork skills.” &#8211; William, Year 3.</em></p>\n          <p>Technology experiences are designed to develop students’ abilities in block coding. Our Kindergarten, Year 1 and Year 2 students learn coding through an online program called Scratch Junior, while our Year 6 students explore Lego Mindstorms.</p>\n          <p><em>“It’s like driving a car, but using an iPad. I look forward to programming my robot to go where it’s meant to go.” Charlotte P</em><em>, Year 3.</em></p>\n          <p>We would like to acknowledge our wonderful P&amp;F committee for supporting our students’ STEM learning through their many fundraising initiatives.</p>\n          <p><strong>Mr Darren Oen Head of Science</strong></p>",
