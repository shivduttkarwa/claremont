      "body": "<p>Established in 1996, Planet Ark&#8217;s National Tree Day has grown into Australia&#8217;s largest community tree planting and nature care event. The program is a call to action for all Australians to get their hands dirty and give back to their community. Each year, around 300,000 people volunteer their time to engage in environmental activities that educate Australians about the world around them. While every day can be Tree Day, we dedicate this celebration of Schools Tree Day and National Tree Day to the last Friday and last Sunday in July.</p>\n          <p>So today is Schools’ Tree Day and Sunday is National Tree Day.</p>\n          <p><em>Trees are a gift to our planet and ourselves. They support life on earth and provide humans and animals with the air we breathe.</em><em> The livelihood of our world and its inhabitants depends on the health of our trees and forests.</em>The National Tree Day website lists the reasons trees are so important and&nbsp;it is well worth a visit to help to explain to your child/ren why we need&nbsp;trees. Such as:</p>\n          <p>&#8211; To tackle climate change<br>&#8211; To clean the air<br>&#8211; To prevent soil erosion and improve water quality<br>&#8211; To create and restore habitats<br>&#8211; To improve mental and physical health</p>\n          <p>Another site well worth a visit with your child/ren is&nbsp;<a href=\"https://www.treepeople.org/22-benefits-of-trees/\">https://www.treepeople.org/22-&#8230;</a>&nbsp;which lists 22 benefits of trees including:</p>\n          <p>&#8211; They cool the environment<br>&#8211; They mark the seasons<br>|- They provide food for some animals</p>\n          <p><em>WOW, WOW, WOW…Trees really are the ‘bees knees’ aren’t they?</em></p>\n          <p>The horrific fires and heatwaves in the Northern Hemisphere are a reminder of the stress our world is under, and how trees are one piece in the puzzle of healing our planet.</p>\n          <p>Today we planted a Dwarf Apple Flowering Gum tree in the front corner of the school (at the corner of Coogee Bay Road and Judge Street), with the help of Year 4 students, <em>Hamish F, Mariana C-L, James P and Aria J,</em> to do our little bit for our environment. We hope that all of our Claremont families are able to plant a tree this weekend in your yard or even a small tree in a pot, to signify the importance of this national recognition of trees.</p>\n          <p><strong>Janelle Ford, Deputy Principal</strong></p>",
