      "body": "<p>Leading up to the school holidays, I will be joining with our Classroom teachers to talk to each grade about Protective Behaviours. For parents&#8217; information and to facilitate follow up conversations with your children after the lessons, we wanted to provide a summary of the messages contained in the lessons.</p>\n          <p>The lesson will be delivered in a way that’s fully age-appropriate. The lessons will include the following messages:</p>\n          <p><em>Private parts are private &#8211; </em>Your underwear covers your private parts and no one should ask to see or touch them. Sometimes a doctor, nurse or family members might have to. But they should always explain why, and ask you if it&#8217;s OK first.</p>\n          <p><em>Always remember your body belongs to you &#8211; </em>Your body belongs to you. No one should ever make you do things that make you feel embarrassed or uncomfortable. If someone asks to see, or tries to touch you, underneath your underwear, say &#8216;NO&#8217; – and tell someone you trust and like to speak to.</p>\n          <p><em>No means no &#8211; </em>No means no and you always have the right to say ‘no’ – even to a family member or someone you love. You’re in control of your body and the most important thing is how YOU feel. If you want to say ‘no’, it’s your choice.</p>\n          <p><em>Talk about secrets that upset you </em>- There are safe and unsafe secrets. Safe secrets can be things like surprise parties or presents for other people. Unsafe secrets make you feel sad, worried or frightened. You should tell an adult you trust about an unsafe secret straight away.</p>\n          <p><em>Speak up, someone can help</em> &#8211; Talk about stuff that makes you worried or upset. If you ever feel sad, anxious or frightened you should talk to an adult you trust like mum or dad. But this adult doesn&#8217;t have to be a family member. It can also be a teacher or a friend&#8217;s parent.</p>\n          <p><strong>Miss Catherine McKersie School Counsellor</strong></p>",
